<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Agent City</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #05030d; overflow: hidden; cursor: default; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 34px; bottom: var(--pad, 110px);
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    color: #e9f6ff; pointer-events: none; user-select: none;
    text-shadow: 0 0 18px rgba(0, 0, 0, .9);
  }
  #hud .row { display: flex; gap: 38px; align-items: flex-end; }
  #hud .stat .k {
    font-size: 11px; letter-spacing: .28em; color: rgba(190, 230, 255, .62);
    display: flex; align-items: center; gap: 7px; margin-bottom: 4px;
  }
  #hud .stat .k::before {
    content: ""; width: 6px; height: 6px; background: #27e8ff; box-shadow: 0 0 8px #27e8ff;
    transform: rotate(45deg);
  }
  #hud .stat:nth-child(2) .k::before { background: #ff3df2; box-shadow: 0 0 8px #ff3df2; }
  #hud .stat:nth-child(3) .k::before { background: #ffd23f; box-shadow: 0 0 8px #ffd23f; }
  #hud .stat .v {
    font-size: 44px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums;
    letter-spacing: -.01em;
    text-shadow: 1.5px 0 0 rgba(255, 40, 120, .55), -1.5px 0 0 rgba(20, 230, 255, .55), 0 0 22px rgba(0, 0, 0, .9);
  }
  #hud .stat .s { font-size: 11px; color: rgba(190, 230, 255, .55); margin-top: 6px; letter-spacing: .06em; height: 13px; }
  #hud .chips { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; max-width: 60vw; }
  #hud .chip {
    font-size: 10.5px; letter-spacing: .14em; padding: 4px 9px 4px 8px;
    border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
    background: color-mix(in srgb, var(--c) 10%, rgba(5, 3, 13, .55));
    color: color-mix(in srgb, var(--c) 70%, white);
    display: flex; gap: 7px; align-items: center;
    clip-path: polygon(0 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 7px 100%, 0 calc(100% - 7px));
    opacity: .55; transition: opacity .6s;
  }
  #hud .chip.on { opacity: 1; }
  #hud .chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
  #hud .chip.on i { animation: pulse 1.1s infinite ease-in-out; }
  #hud .chip b { font-weight: 600; color: white; }
  @keyframes pulse { 50% { opacity: .25; } }
  #offline { position: fixed; right: 24px; bottom: 24px; font: 10px "SF Mono", Menlo, monospace; letter-spacing: .2em; color: #ff3b5c; opacity: 0; transition: opacity 1s; }
  #offline.on { opacity: .8; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/jsm/" } }
</script>
</head>
<body>
<div id="hud">
  <div class="row">
    <div class="stat"><div class="k">PROJECTS</div><div class="v" id="projects">0</div><div class="s" id="projects-s"></div></div>
    <div class="stat"><div class="k">AGENTS</div><div class="v" id="agents">0</div><div class="s" id="agents-s">idle</div></div>
    <div class="stat"><div class="k">TOKENS TODAY</div><div class="v" id="tokens">0</div><div class="s" id="tokens-s"></div></div>
  </div>
  <div class="chips" id="chips"></div>
</div>
<div id="offline">COLLECTOR OFFLINE</div>
<script type="module" src="./city.js"></script>
</body>
</html>
